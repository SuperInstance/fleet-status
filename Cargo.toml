[package]
name = "fleet-status"
version = "0.1.0"
edition = "2021"
description = "CLI tool for monitoring all SuperInstance fleet services"

[[bin]]
name = "fleet-status"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
colored = "2"
clap = { version = "4", features = ["derive"] }
